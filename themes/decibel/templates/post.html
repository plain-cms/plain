<article class="post">
  <header class="page-header">
    <p class="date"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>
    <h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>
    {{/if}}
  </header>
  {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" loading="lazy" decoding="async">
  {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>
  {{/if}}{{#if page.tagLinks}}
  <p class="tags"><span class="cap">{{ strings.tagged }}</span> {{#each page.tagLinks as tag}}<a href="{{ tag.url }}">{{ tag.name }}</a> {{/each}}</p>
  {{/if}}
</article>
