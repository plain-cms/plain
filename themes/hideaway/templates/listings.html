<section class="page listings">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    <p class="lede">{{ strings.listingsLede }}</p>
  </header>
  {{#if items}}<ul class="lane">
    {{#each items as item}}{{> window}}
    {{/each}}
  </ul>
  {{else}}<p class="empty">{{ strings.noListings }}</p>
  {{/if}}{{> pager}}
  {{> inquiry}}
</section>
