<article class="post cols">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {{#if page.dateFormatted}}<p class="meta"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>{{/if}}
    {{#if page.tagLinks}}<ul class="tags" role="list" aria-label="{{ strings.tags }}">
      {{#each page.tagLinks as tag}}<li><a href="{{ tag.url }}">{{ tag.name }}</a></li>
      {{/each}}
    </ul>{{/if}}
  </header>
  <div class="body">
    {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" loading="lazy" decoding="async">
    {{/if}}<div class="prose">
{{{ page.content }}}
    </div>
  </div>
</article>
