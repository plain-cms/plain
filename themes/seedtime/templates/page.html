<article>
  <header class="head">
    <h1 class="title">{{ page.title }}</h1>
    {{#if page.description}}<p class="standfirst">{{ page.description }}</p>
    {{/if}}
  </header>
  {{#if page.url.4}}{{else}}{{#if collections.posts}}<div class="calendar-block" aria-hidden="true">
    <p class="calendar-label"><span class="key-box"></span>{{ strings.calendarLabel }}</p>
    <div class="strip strip-l calendar">{{> months}}<span hidden>{{#each collections.posts as entry}}<i data-date="{{ entry.date }}"></i>{{/each}}</span></div>
  </div>
  {{/if}}{{/if}}<div class="prose">
{{{ page.content }}}
  </div>
</article>
