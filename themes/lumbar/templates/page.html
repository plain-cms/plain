<article class="page">
  <header class="page-header{{#if page.url.4}}{{else}} home-header{{/if}}">
    <h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>
    {{/if}}
  </header>
  {{#if page.url.4}}{{else}}{{#if collections.services}}
  <ul class="index home-chart" data-list="/care/">
    {{#each collections.services as item}}{{> index-item}}
    {{/each}}
  </ul>
  <p class="chart-foot"><a href="/care/">{{ strings.careIndexLink }}</a></p>
  {{/if}}{{/if}}
  {{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>{{/if}}
</article>
