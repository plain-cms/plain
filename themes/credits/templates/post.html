<article class="post">
  <header class="wrap page-header">
    <h1>{{ page.title }}</h1>
    <p class="role-meta">{{#if page.date}}<time class="row-when" datetime="{{ page.date }}">{{ page.dateFormatted }}</time>{{/if}}{{#if page.tagLinks}}<span class="tags">{{#each page.tagLinks as tag}} <a class="tag" href="{{ tag.url }}">{{ tag.name }}</a>{{/each}}</span>{{/if}}</p>
  </header>
  <div class="wrap">
    {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" loading="lazy" decoding="async">
    {{/if}}<div class="prose">
{{{ page.content }}}
    </div>
  </div>
</article>
{{> profile-card}}
