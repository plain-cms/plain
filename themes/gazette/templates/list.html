<section class="front">
  <header class="front-head">
    <h1 class="front-label">{{ page.title }}{{#if tag}} · {{ tag }}{{/if}}</h1>
  </header>
  {{#if items}}
  <ol class="front-grid" role="list">
    {{#each items as item}}{{> story-card}}
    {{/each}}
  </ol>
  {{else}}
  <p class="empty">{{ strings.nothingHere }}</p>
  {{/if}}
  {{> pagination}}
</section>
