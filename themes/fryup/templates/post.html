<article class="split post">
  <header class="side">
    {{#if page.dateFormatted}}<p class="label"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>{{/if}}
    <h1>{{ page.title }}</h1>
    {{#if page.tagLinks}}<ul class="tags" aria-label="{{ strings.tags }}">
      {{#each page.tagLinks as entry}}<li><a href="{{ entry.url }}">{{ entry.name }}</a></li>
      {{/each}}
    </ul>{{/if}}
  </header>
  <div class="entry">
    {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" loading="lazy" decoding="async">
    {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
    </div>{{/if}}
  </div>
</article>
