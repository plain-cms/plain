<article class="split dish">
  <header class="side">
    {{#if page.section}}<p class="label">{{ page.section }}</p>{{/if}}
    <h1>{{ page.title }}</h1>
    {{#if page.price}}<p class="cell"><span class="label">{{ strings.price }}</span> <span class="written">{{ page.price }}</span></p>{{/if}}
  </header>
  <div class="entry">
    {{#if page.description}}<p class="lead">{{ page.description }}</p>{{/if}}
    {{#if page.content}}<div class="prose">
{{{ page.content }}}
    </div>{{/if}}
    <p class="back"><a href="/menu/">{{ strings.backToMenu }}</a></p>
  </div>
</article>
