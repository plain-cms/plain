<section class="page">
  <div class="page-side">
    <header class="page-header">
      <h1>{{ page.title }}</h1>
      {{#if items}}<p class="lead">{{ strings.servicesNote }}</p>{{/if}}
    </header>
  </div>
  <div class="page-main">
    <div class="sheet">
      <div class="sheet-head">
        <h2>{{ strings.servicesHeading }}</h2>
        <p class="sheet-job">{{ site.title }}</p>
      </div>
      {{#if items}}<ol class="beams">
        {{#each items as item}}{{> service-row}}
        {{/each}}
      </ol>{{else}}<p class="empty">{{ strings.servicesEmpty }}</p>{{/if}}
    </div>
    {{> pagination}}
  </div>
</section>
