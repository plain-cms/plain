<article class="home">
  <header class="home-head">
    <h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>{{/if}}
    <p class="home-go"><a href="/products/">{{ strings.allProducts }}</a></p>
  </header>
  <div class="featured">
    <ul class="bed" role="list" aria-label="{{ strings.featuredLabel }}">{{#each collections.products as item}}{{#if item.featured}}{{> label}}{{/if}}{{/each}}</ul>
    <p class="more"><a href="/products/">{{ strings.allProducts }}</a></p>
  </div>
  {{#if page.content}}<div class="prose home-body">
{{{ page.content }}}
  </div>{{/if}}
</article>
