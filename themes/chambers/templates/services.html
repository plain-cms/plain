<section class="page has-briefs">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {{#if items}}<p class="lead">{{ strings.servicesNote }}</p>{{/if}}
  </header>
  {{#if items}}<ol class="briefs">
    {{#each items as item}}{{> brief}}
    {{/each}}
  </ol>{{else}}<p class="empty">{{ strings.servicesEmpty }}</p>{{/if}}
  {{> pagination}}
</section>
