<article class="post">
  {{> band}}
  <header class="page-head wrap">
    <h1>{{ page.title }}</h1>
    <p class="typed post-meta"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time>{{#if page.tagLinks}}<span class="tags">{{#each page.tagLinks as tag}}<a href="{{ tag.url }}">{{ tag.name }}</a> {{/each}}</span>{{/if}}</p>
  </header>
  {{#if page.cover}}<figure class="project-cover wrap"><span class="cutting"><img src="{{ page.cover }}" alt="" decoding="async"></span></figure>
  {{/if}}{{#if page.content}}<div class="prose wrap">
{{{ page.content }}}
  </div>{{/if}}
</article>
