<section class="page">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {{#if items}}<p class="lead">{{ strings.servicesNote }}</p>{{/if}}
  </header>
  <div class="schedule">
    {{#if items}}<ol class="clauses">
      {{#each items as item}}{{> service-row}}
      {{/each}}
    </ol>{{else}}<p class="empty">{{ strings.servicesEmpty }}</p>{{/if}}
    {{> pagination}}
  </div>
</section>
