<section class="list column">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="list-body">
  {{#if items}}
  <ul class="entry-list">
    {{#each items as item}}<li class="entry">
      <h2><a href="{{ item.url }}">{{ item.title }}</a></h2>
      <p class="wall-label"><time datetime="{{ item.date }}">{{ item.dateFormatted }}</time></p>
      {{#if item.description}}<p class="entry-summary">{{ item.description }}</p>{{/if}}
    </li>
    {{/each}}
  </ul>
  {{else}}
  <p class="empty">{{ strings.nothingHere }}</p>
  {{/if}}
  </div>
  {{> pagination}}
</section>
