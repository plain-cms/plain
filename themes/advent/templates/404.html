<section class="not-found card">
  <ol class="doors" role="list">
    <li class="door">
      <div class="door-head"><p class="door-time" aria-hidden="true">404</p></div>
      <div class="door-text">
        <h1 class="door-title">{{ strings.notFoundTitle }}</h1>
        <p class="door-note">{{ strings.notFoundBody }}</p>
      </div>
    </li>
  </ol>
  <p class="not-found-links"><a href="/">{{ strings.goHome }}</a> <a href="/programme/">{{ strings.seeProgramme }}</a></p>
</section>
