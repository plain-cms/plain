<article class="post">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {{#if page.date}}<p class="meta"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time>{{#each page.tagLinks as tag}} <a href="{{ tag.url }}">{{ tag.name }}</a>{{/each}}</p>{{/if}}
  </header>
  {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" loading="lazy" decoding="async">
  {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>{{/if}}
  {{> call}}
</article>
