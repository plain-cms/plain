<article class="post">
  <header class="page-head">
    {{#if page.date}}<p class="note-date"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>
    {{/if}}<h1>{{ page.title }}</h1>
    {{#if page.tagLinks}}<ul class="tags" aria-label="{{ strings.tags }}">
      {{#each page.tagLinks as tag}}<li><a href="{{ tag.url }}">{{ tag.name }}</a></li>
      {{/each}}
    </ul>
    {{/if}}
  </header>
  {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" loading="lazy" decoding="async">
  {{/if}}<div class="prose">
{{{ page.content }}}
  </div>
</article>
