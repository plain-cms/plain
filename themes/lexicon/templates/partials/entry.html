<li class="entry">{{#if item.photo}}<img class="entry-photo" src="{{ item.photo }}" alt="" loading="lazy" decoding="async">{{/if}}<h2 class="hw"><a href="{{ item.url }}">{{ item.title }}</a></h2>{{#if item.discipline}} <span class="pos">{{ item.discipline }}</span>{{/if}}{{#if item.dateFormatted}} <span class="pos"><time datetime="{{ item.date }}">{{ item.dateFormatted }}</time></span>{{/if}}{{#if item.description}} <span class="def">{{ item.description }}</span>{{/if}}</li>
