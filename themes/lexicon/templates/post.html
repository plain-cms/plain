<article class="post">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    <p class="meta"><span class="pos"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></span>{{#if page.tagLinks}}
      <span class="tags"><span class="tags-label">{{ strings.tagsLabel }}</span> {{#each page.tagLinks as tag}}<a class="tag" href="{{ tag.url }}">{{ tag.name }}</a> {{/each}}</span>{{/if}}</p>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>
    {{/if}}
  </header>
  {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" decoding="async">
  {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>{{/if}}
</article>
