<article class="post">
  <header class="page-header">
    {{#if page.dateFormatted}}<p class="meta"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>{{/if}}
    <h1>{{ page.title }}</h1>
    {{#if page.tagLinks}}<ul class="tags" role="list">
      {{#each page.tagLinks as link}}<li><a href="{{ link.url }}">{{ link.name }}</a></li>
      {{/each}}
    </ul>{{/if}}
  </header>
  {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" loading="lazy" decoding="async">
  {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>{{/if}}
</article>
