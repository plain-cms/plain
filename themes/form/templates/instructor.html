<article class="instructor">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {{#if page.discipline}}<p class="discipline">{{ page.discipline }}</p>
    {{/if}}
  </header>
  {{#if page.photo}}<img class="instructor-photo" src="{{ page.photo }}" alt="{{ page.title }}" decoding="async">
  {{/if}}<div class="prose">
{{{ page.content }}}
  </div>
  <aside class="catch-classes">
    <h2 class="eyebrow">{{ strings.catchClasses }}</h2>
    <p>{{ strings.catchClassesBody }}</p>
    {{#if data.schedule.trialNote}}<p class="trial-note">{{ data.schedule.trialNote }}</p>
    {{/if}}<p><a class="btn-trial" href="/schedule/">{{ strings.seeSchedule }}</a></p>
  </aside>
</article>
