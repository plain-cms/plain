<article class="home">
  <header class="home-head">
    <h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>{{/if}}
    <p class="more"><a href="/products/">{{ strings.allProducts }}</a></p>
  </header>
  <div class="wall"><ul class="drawers" role="list" aria-label="{{ strings.featuredLabel }}">{{#each collections.products as item}}{{#if item.featured}}{{> drawer}}{{/if}}{{/each}}</ul></div>
  {{#if page.content}}<div class="prose home-text">
{{{ page.content }}}
  </div>{{/if}}
</article>
