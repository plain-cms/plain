<article class="home">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>{{/if}}
  </header>
  <div class="featured">
    <ul class="crates" role="list" aria-label="{{ strings.featuredLabel }}">{{#each collections.products as item}}{{#if item.featured}}{{> crate}}{{/if}}{{/each}}</ul>
    <p class="more"><a href="/products/">{{ strings.allProducts }}</a></p>
  </div>
  {{#if page.content}}<div class="board"><div class="slat prose">
{{{ page.content }}}
  </div></div>{{/if}}
</article>
