<article class="page post">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    <p class="page-meta"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>
    {{#if page.tagLinks}}<ul class="tags" aria-label="{{ strings.tags }}">{{#each page.tagLinks as tag}}<li><a href="{{ tag.url }}">{{ tag.name }}</a></li>{{/each}}</ul>{{/if}}
  </header>
  {{#if page.cover}}<figure class="plate">
    <img src="{{ page.cover }}" alt="" decoding="async">
  </figure>
  {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>{{/if}}
</article>
