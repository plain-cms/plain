<article class="home">
  <header class="home-head">
    <h1>{{ page.title }}</h1>
    <div class="hallmark hallmark-lg" aria-hidden="true"><span></span><span></span><span></span></div>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>{{/if}}
  </header>
  <div class="tray">
    <ul class="pieces velvet" role="list" aria-label="{{ strings.featuredLabel }}">{{#each collections.products as item}}{{#if item.featured}}{{> piece}}{{/if}}{{/each}}</ul>
    <p class="more"><a href="/products/">{{ strings.allProducts }}</a></p>
  </div>
  {{#if page.content}}<div class="prose home-text">
{{{ page.content }}}
  </div>{{/if}}
</article>
