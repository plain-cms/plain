<article class="essay">
  <header class="essay-header">
    <h1 class="essay-title">{{ page.title }}</h1>
    {{#if page.description}}<p class="essay-subtitle">{{ page.description }}</p>
    {{/if}}<div class="essay-meta" data-read-label="{{ strings.minRead }}">
      <time datetime="{{ page.date }}">{{ page.dateFormatted }}</time>
      {{#if page.tagLinks}}<ul role="list" class="tags" aria-label="{{ strings.filedUnder }}">
        {{#each page.tagLinks as tag}}<li><a class="tag" href="{{ tag.url }}">{{ tag.name }}</a></li>
        {{/each}}
      </ul>{{/if}}
    </div>
  </header>
  {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" decoding="async">
  {{/if}}<div class="prose essay-body">
{{{ page.content }}}
  </div>
  <p class="essay-back"><a href="/blog/">{{ strings.backToArchive }}</a></p>
</article>
