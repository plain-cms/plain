{{#if collections.projects}}<nav class="spike" aria-labelledby="spike-title">
    <h2 id="spike-title">{{ strings.moreWork }}</h2>
    <ul>
      {{#each collections.projects as item}}<li><a href="{{ item.url }}"><span>{{ item.title }}</span> <time class="year" datetime="{{ item.date }}">{{ item.date }}</time></a></li>
      {{/each}}
    </ul>
    <p><a href="/work/">{{ strings.allWork }}</a></p>
  </nav>{{/if}}
