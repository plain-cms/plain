<article class="leaf">
  <header class="cover">
    <div class="cover-frame">
      <h1>{{ page.title }}</h1>
      {{#if page.description}}<p class="cover-for">{{ page.description }}</p>
      {{/if}}<p class="cover-imprint">{{ site.title }}</p>
    </div>
  </header>
  <div class="leaf-body">
    {{#if page.showSchedule}}{{> timetable}}
    {{/if}}{{#if page.content}}<div class="sheet prose">
{{{ page.content }}}
    </div>
    {{/if}}
  </div>
</article>
