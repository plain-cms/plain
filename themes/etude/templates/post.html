<article class="leaf post">
  <header class="cover">
    <div class="cover-frame">
      <h1>{{ page.title }}</h1>
      {{#if page.description}}<p class="cover-for">{{ page.description }}</p>
      {{/if}}<p class="cover-date"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>
      <p class="cover-imprint">{{ site.title }}</p>
    </div>
  </header>
  <div class="leaf-body">
    {{#if page.cover}}<img class="plate wide" src="{{ page.cover }}" alt="" decoding="async">
    {{/if}}{{#if page.content}}<div class="sheet prose">
{{{ page.content }}}
    </div>
    {{/if}}{{#if page.tagLinks}}<p class="tags">{{#each page.tagLinks as tag}}<a href="{{ tag.url }}">{{ tag.name }}</a> {{/each}}</p>
    {{/if}}
  </div>
</article>
