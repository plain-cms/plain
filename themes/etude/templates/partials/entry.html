<li class="entry{{#if item.photo}} has-photo{{/if}}">
  {{#if item.photo}}<img class="entry-photo" src="{{ item.photo }}" alt="" loading="lazy" decoding="async">
  {{/if}}<h2 class="entry-title"><a href="{{ item.url }}">{{ item.title }}</a></h2>
  {{#if item.discipline}}<p class="entry-for">{{ item.discipline }}</p>
  {{/if}}{{#if item.dateFormatted}}<p class="entry-date"><time datetime="{{ item.date }}">{{ item.dateFormatted }}</time></p>
  {{/if}}{{#if item.description}}<p class="entry-desc">{{ item.description }}</p>
  {{/if}}
</li>
