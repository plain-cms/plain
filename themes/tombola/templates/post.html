<article class="post">
  <header class="page-header">
    {{#if page.dateFormatted}}<p class="post-date"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>{{/if}}
    <h1>{{ page.title }}</h1>
  </header>
  <div class="page-cols">
    <div class="page-main">
      <div class="prose">
{{{ page.content }}}
      </div>
      {{#if page.tagLinks}}<ul class="tags" role="list">{{#each page.tagLinks as tag}}<li><a href="{{ tag.url }}">{{ tag.name }}</a></li>{{/each}}</ul>{{/if}}
      <p class="back"><a href="/blog/">{{ strings.allUpdates }}</a></p>
    </div>
    {{> card}}
  </div>
</article>
