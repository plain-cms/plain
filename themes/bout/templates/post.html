<article class="post">
  <header class="poster-head">
    <h1>{{ page.title }}</h1>
    <p class="post-meta"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time>{{#if page.tagLinks}}{{#each page.tagLinks as tag}} <a class="tag" href="{{ tag.url }}">{{ tag.name }}</a>{{/each}}{{/if}}</p>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>
    {{/if}}
  </header>
  {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" decoding="async">
  {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>
  {{/if}}
</article>
