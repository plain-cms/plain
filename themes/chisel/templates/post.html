<article class="post">
  <header class="tablet tablet-plaque">
    <h1 class="inscription">{{ page.title }}</h1>
    <p class="entry-meta"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>
    {{#if page.tagLinks}}<ul class="services tags">{{#each page.tagLinks as tag}}<li><a href="{{ tag.url }}">{{ tag.name }}</a></li> {{/each}}</ul>
    {{/if}}
  </header>
  {{#if page.cover}}<figure class="cover"><img src="{{ page.cover }}" alt="" decoding="async"></figure>
  {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>
  {{/if}}
</article>
