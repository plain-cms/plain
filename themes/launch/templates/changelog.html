<section class="changelog">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    <p class="lede">{{ strings.changelogLede }}</p>
  </header>
  {{#if items}}
  <ol class="timeline{{#if pagination.newer}}{{else}} is-live{{/if}}" role="list" reversed data-copy-label="{{ strings.copyLink }}">
    {{#each items as item}}
    <li class="release-item" data-tag="{{ item.tag }}">
      {{> release-meta}}
      <h2 class="release-title"><a href="{{ item.url }}">{{ item.title }}</a></h2>
      {{#if item.description}}<p class="release-desc">{{ item.description }}</p>
      {{/if}}
    </li>
    {{/each}}
  </ol>
  {{else}}
  <p class="empty">{{ strings.nothingHere }}</p>
  {{/if}}
  {{> pagination}}
</section>
