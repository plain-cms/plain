{{#if page.heroTagline}}
<article class="page landing">
  {{> hero}}
  <div class="prose landing-prose">
{{{ page.content }}}
  </div>
</article>
{{else}}
<article class="page">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {{> lede}}
  </header>
  {{#if page.showPricing}}<h2 class="visually-hidden">{{ strings.pricingHeading }}</h2>
  {{> pricing}}
  {{/if}}<div class="prose">
{{{ page.content }}}
  </div>
</article>
{{/if}}
