<article class="sheet post">
  <header class="sheet-head role-head">
    {{#if page.tagLinks}}<p class="eyebrow tags">{{#each page.tagLinks as tag}}<a href="{{ tag.url }}">{{ tag.name }}</a> {{/each}}</p>
    {{/if}}<h1 class="sheet-title">{{ page.title }}</h1>
    {{#if page.date}}<p class="entry-when"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>
    {{/if}}
  </header>
  <div class="sheet-body">
    {{#if page.cover}}<img class="cover-image" src="{{ page.cover }}" alt="" loading="lazy" decoding="async">
    {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
    </div>
    {{/if}}<div class="filler"></div>
  </div>
</article>
