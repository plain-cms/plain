<article class="post">
  <header class="page-header">
    {{#if page.dateFormatted}}<p class="meta"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>{{/if}}
    <h1>{{ page.title }}</h1>
  </header>
  {{#if page.cover}}<img class="cover-image" src="{{ page.cover }}" alt="" decoding="async">
  {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>{{/if}}
  {{#if page.tagLinks}}<ul class="tags" aria-label="{{ strings.tagged }}">
    {{#each page.tagLinks as tag}}<li><a href="{{ tag.url }}">{{ tag.name }}</a></li>
    {{/each}}
  </ul>{{/if}}
</article>
