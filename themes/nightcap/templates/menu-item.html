<article class="drink-page">
  <div class="inside">
    <header class="page-header">
      {{#if page.section}}<p class="meta">{{ page.section }}</p>{{/if}}
      <h1>{{ page.title }}</h1>
    </header>
    {{#if page.description}}<p class="note">{{ page.description }}</p>{{/if}}
    {{#if page.price}}<p class="drink-price">{{ page.price }}</p>{{/if}}
    {{#if page.content}}<div class="prose">
{{{ page.content }}}
    </div>{{/if}}
  </div>
  <p class="back"><a href="/menu/">{{ strings.backToMenu }}</a></p>
</article>
