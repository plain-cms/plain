<article class="sheet">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date }}">{{ page.dateFormatted }}</time>
      {{#each page.tagLinks as tag}}<a href="{{ tag.url }}">{{ tag.name }}</a>
      {{/each}}
    </p>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>
    {{/if}}
  </header>
  {{> call-cta}}
  {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" loading="lazy" decoding="async">
  {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>
  {{/if}}
</article>
