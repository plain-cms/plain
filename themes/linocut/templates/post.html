<article class="post">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    <p class="pencil"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>
    {{#if page.tagLinks}}<ul class="tags" aria-label="{{ strings.tags }}">{{#each page.tagLinks as tag}}<li><a href="{{ tag.url }}">{{ tag.name }}</a></li>{{/each}}</ul>{{/if}}
  </header>
  {{#if page.cover}}<img class="post-cover" src="{{ page.cover }}" alt="" decoding="async">
  {{/if}}{{#if page.content}}<div class="sheet">
    <div class="prose">
{{{ page.content }}}
    </div>
  </div>{{/if}}
</article>
