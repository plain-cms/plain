<article class="page is-post">
  <header class="page-head">
    <p class="eyebrow"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>
    <h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>
    {{/if}}{{#if page.tagLinks}}<ul class="tags" aria-label="{{ strings.tagsLabel }}">{{#each page.tagLinks as tag}}<li><a href="{{ tag.url }}">{{ tag.name }}</a></li>{{/each}}</ul>
    {{/if}}
  </header>
  {{#if page.cover}}<figure class="print-photo cover"><img src="{{ page.cover }}" alt="" loading="lazy" decoding="async"></figure>
  {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>
  {{/if}}
</article>
