<li class="entry">
  <h3 class="entry-title"><a href="{{ item.url }}">{{ item.title }}</a></h3>
  {{#if item.date}}<p class="entry-date"><time datetime="{{ item.date }}">{{ item.dateFormatted }}</time></p>
  {{/if}}{{#if item.description}}<p class="entry-text">{{ item.description }}</p>
  {{/if}}
</li>
