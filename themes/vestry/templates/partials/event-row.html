<li class="ev"{{#if item.status}} data-status="{{ item.status }}"{{/if}}>
  <p class="ev-when"><time datetime="{{ item.date }}">{{ item.dateFormatted }}</time>{{#if item.time}} <span class="ev-time">{{ item.time }}</span>{{/if}}</p>
  <div class="ev-what">
    <p class="ev-title"><a href="{{ item.url }}">{{ item.title }}</a></p>
    {{#if item.place}}<p class="ev-place">{{ item.place }}</p>
    {{/if}}{{#if item.description}}<p class="ev-desc">{{ item.description }}</p>{{/if}}
  </div>
  {{#if item.status}}{{> status}}{{/if}}
</li>
