<article class="post">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {{#if page.dateFormatted}}<p class="meta"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>{{/if}}
    {{#if page.tagLinks}}<ul class="tags" role="list">
      {{#each page.tagLinks as tag}}<li><a href="{{ tag.url }}">{{ tag.name }}</a></li>
      {{/each}}
    </ul>{{/if}}
  </header>
  {{#if page.content}}<div class="sheet prose">
    {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" decoding="async">
    {{/if}}
{{{ page.content }}}
  </div>{{else}}{{#if page.cover}}<div class="sheet prose"><img class="cover" src="{{ page.cover }}" alt="" decoding="async"></div>{{/if}}{{/if}}
</article>
