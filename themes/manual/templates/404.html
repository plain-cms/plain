<section class="page not-found">
  <div class="titleblock">
    <nav class="crumb" aria-label="{{ strings.breadcrumb }}">
      <ol>
        <li><a href="/">{{ strings.home }}</a></li>
        <li aria-current="page">{{ strings.notFoundTitle }}</li>
      </ol>
    </nav>
    <span class="doc-id">404</span>
  </div>
  <header class="page-header">
    <h1>{{ strings.notFoundTitle }}</h1>
    <p class="lede">{{ strings.notFoundBody }}</p>
  </header>
  <nav class="lost-nav" aria-label="{{ strings.recoveryNav }}">
    <ul>
      <li><a class="pager-link" href="/docs/"><span class="pager-label">{{ strings.lostIndexLabel }}</span><span class="pager-title">{{ strings.docs }}</span></a></li>
      <li><a class="pager-link" href="/"><span class="pager-label">{{ strings.lostHomeLabel }}</span><span class="pager-title">{{ strings.goHome }}</span></a></li>
      <li><a class="pager-link" href="/search/"><span class="pager-label">{{ strings.lostSearchLabel }}</span><span class="pager-title">{{ strings.searchManual }}</span></a></li>
    </ul>
  </nav>
</section>
