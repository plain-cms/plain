<article class="page">
  <div class="titleblock">
    <nav class="crumb" aria-label="{{ strings.breadcrumb }}">
      <ol>
        <li><a href="/">{{ strings.home }}</a></li>
        <li aria-current="page">{{ page.title }}</li>
      </ol>
    </nav>
  </div>
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>{{/if}}
  </header>
  <div class="prose">
{{{ page.content }}}
  </div>
</article>
