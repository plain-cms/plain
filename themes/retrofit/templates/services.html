<section class="page">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {{#if items}}<p class="lead">{{ strings.servicesNote }}</p>{{/if}}
  </header>
  {{#if items}}<ul class="rows">
    {{#each items as item}}{{> service-row}}
    {{/each}}
  </ul>{{else}}<p class="empty">{{ strings.servicesEmpty }}</p>{{/if}}
  {{> pagination}}
</section>
