<article class="home">
  <header class="home-head">
    <h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>{{/if}}
  </header>
  <div class="tray">
    <ul class="tickets" role="list" aria-label="{{ strings.featuredLabel }}">{{#each collections.products as item}}{{#if item.featured}}{{> ticket}}{{/if}}{{/each}}</ul>
    <p class="tray-more"><a href="/products/">{{ strings.allProducts }}</a></p>
  </div>
  {{#if page.content}}<div class="sheet prose">
{{{ page.content }}}
  </div>{{/if}}
</article>
