<article class="sheet">
  <header class="head">
    <p class="back"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time>{{#each page.tagLinks as tag}} <a href="{{ tag.url }}">{{ tag.name }}</a>{{/each}}</p>
    <h1 class="frieze"><span>{{ page.title }}</span></h1>
  </header>
  {{#if page.description}}<p class="lede">{{ page.description }}</p>
  {{/if}}{{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" loading="lazy" decoding="async">
  {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>
  {{/if}}<div class="side">
    {{> call}}
    {{> jobs}}
  </div>
</article>
