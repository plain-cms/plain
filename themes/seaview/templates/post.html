<article class="post">
<header class="page-head">
<p class="meta"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time>{{#if page.tagLinks}}<span class="tags" aria-label="{{ strings.tagsLabel }}">{{#each page.tagLinks as tag}}<a href="{{ tag.url }}">{{ tag.name }}</a>{{/each}}</span>{{/if}}</p>
<h1>{{ page.title }}</h1>
{{#if page.description}}<p class="lede">{{ page.description }}</p>
{{/if}}
</header>
{{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="{{ page.title }}" decoding="async">
{{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
</div>
{{/if}}
</article>
