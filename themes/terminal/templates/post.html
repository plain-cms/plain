<article class="post">
  <header class="page-header post-header">
    <p class="meta">
      <time datetime="{{ page.date }}" title="{{ page.dateFormatted }}">{{ page.date }}</time>{{#if page.readingTime}}<span class="meta-sep" aria-hidden="true">·</span><span>{{ page.readingTime }}</span>{{/if}}
    </p>
    <h1>{{ page.title }}</h1>
    {{#if page.tagLinks}}<ul class="tags" aria-label="{{ strings.tags }}">{{#each page.tagLinks as tag}}<li><a class="tag" href="{{ tag.url }}">{{ tag.name }}</a></li>{{/each}}</ul>
    {{/if}}
  </header>
  {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" decoding="async">
  {{/if}}<div class="prose">
{{{ page.content }}}
  </div>
  <p class="post-nav"><a href="/blog/">{{ strings.allPosts }}</a></p>
</article>
