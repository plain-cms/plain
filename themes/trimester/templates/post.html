<article class="post">
  <header class="page-head">
    <p class="eyebrow"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time></p>
    <h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>
    {{/if}}
  </header>
  <div class="sheet">
    {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" loading="lazy" decoding="async">
    {{/if}}{{#if page.content}}<div class="prose">
{{{ page.content }}}
    </div>{{/if}}
    {{#if page.tagLinks}}<p class="tags">{{#each page.tagLinks as tag}}<a class="tag" href="{{ tag.url }}">{{ tag.name }}</a> {{/each}}</p>
    {{/if}}
  </div>
</article>
