<article class="home">
  <header class="home-head">
    <h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>{{/if}}
  </header>
  <ul class="hanks" role="list" aria-label="{{ strings.featuredLabel }}">{{#each collections.products as item}}{{#if item.featured}}{{> hank}}{{/if}}{{/each}}</ul>
  <p class="more"><a href="/products/">{{ strings.allProducts }}</a></p>
  {{#if page.content}}<div class="prose">
{{{ page.content }}}
  </div>{{/if}}
</article>
