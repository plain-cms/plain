<article class="post">
  <header class="page-header">
    {{#if page.date}}<p class="eyebrow"><time datetime="{{ page.date }}">{{ page.dateFormatted }}</time>{{#each page.tagLinks as tag}} <a class="tag" href="{{ tag.url }}">{{ tag.name }}</a>{{/each}}</p>
    {{/if}}<h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>
    {{/if}}
  </header>
  {{#if page.cover}}<img class="cover" src="{{ page.cover }}" alt="" decoding="async">
  {{/if}}<div class="columns">
    {{#if page.content}}<div class="prose">
{{{ page.content }}}
    </div>
    {{/if}}{{> call}}
  </div>
</article>
