<article class="sheet">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {{#if page.description}}<p class="lede">{{ page.description }}</p>{{/if}}
  </header>
  {{> pass}}
  <div class="sheet-main">
    {{#if page.showProgramme}}{{#if data.event.programme}}{{> programme}}{{/if}}{{/if}}
    <div class="prose">
{{{ page.content }}}
    </div>
    {{#if page.showPeople}}{{#if data.event.people}}{{> people}}{{/if}}{{/if}}
    {{> reply-end}}
  </div>
</article>
